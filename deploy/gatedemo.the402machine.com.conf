server {
  listen 80;
  listen [::]:80;
  server_name gatedemo.the402machine.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 301 https://gatedemo.the402machine.com$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name gatedemo.the402machine.com;

  ssl_certificate /etc/letsencrypt/live/gatedemo.the402machine.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gatedemo.the402machine.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  client_max_body_size 8k;
  location / {
    proxy_pass http://127.0.0.1:4130;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
  }
}
